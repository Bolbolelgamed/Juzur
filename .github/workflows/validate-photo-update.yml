name: Validate photo update
on:
  push:
    branches: [codex/optimized-product-photos]
    paths: ['src/**', '.github/workflows/validate-photo-update.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check responsive photo references
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const name of ['Hero', 'Gallery', 'GiftSection', 'VideoSection']) {
            const source = readFileSync('src/components/' + name + '.jsx', 'utf8');
            for (const match of source.matchAll(/new-photos\/(juzur-photo-\d+)(?:-480)?\.webp/g)) {
              for (const suffix of ['', '-480', '-960']) {
                assert(existsSync('dist/client/assets/new-photos/' + match[1] + suffix + '.webp'));
              }
            }
          }
          assert(!existsSync('dist/client/photo-originals'));
          JS
